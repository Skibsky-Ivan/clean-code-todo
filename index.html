<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="wrapper">
      <header class="hero">
        <img class="hero_img" src="./eisenhower-matrix.jpg" />
        <a
          class="more_inf"
          href="https://goal-life.com/page/method/matrix-eisenhower"
          >Want more details&quest;</a
        >
      </header>

      <main class="content">
        <section class="add_task_section">
          <h3>
            <label class="new_task_label" for="new_task">Add Item</label>
          </h3>
          <div class="task_row_wrapper">
            <input id="new_task_input" class="new_task_input" type="text" />
            <button id="add_button" class="base_button">Add</button>
          </div>
        </section>

        <section class="incomplete_tasks_section">
          <h3>Todo</h3>
          <ul class="list_tasks incomplete_tasks"></ul>
        </section>

        <section class="complete_tasks_section">
          <h3>Completed</h3>
          <ul class="list_tasks completed_tasks"></ul>
        </section>
      </main>
    </div>

    <script type="text/javascript" src="app.js"></script>
  </body>
</html>
